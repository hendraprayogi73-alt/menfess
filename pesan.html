<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Isi pesan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head><body><main>
<div class="bar">
  <a class="btn ghost" href="admin.html">Kembali</a>
  <div class="acts">
    <button class="ghost" id="hapus" hidden>Hapus</button>
    <button id="unduh" hidden>Unduh gambar</button>
  </div>
</div>
<div class="msg" id="err" role="alert">Memuat…</div>

<div class="frame panel" id="ctrl" hidden>
  <label for="jwb" style="margin-top:0">Jawabanmu <span class="count" id="cnt">0/400</span></label>
  <textarea id="jwb" maxlength="400" style="min-height:110px" placeholder="Ketik jawaban di sini. Jawaban akan muncul di gambar."></textarea>
  <label for="fmt">Ukuran gambar</label>
  <select id="fmt">
    <option value="feed">Feed Instagram (1080 x 1350)</option>
    <option value="story">Story (1080 x 1920)</option>
  </select>
</div>
<canvas id="c" width="1080" height="1350" hidden></canvas>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const key = sessionStorage.getItem("key");
const id = new URLSearchParams(location.search).get("id");
if (!key || !id) location.replace("admin.html");
let pesan, bgImg, timer;

function wrap(ctx, text, maxW) {
  const lines = [];
  text.split("\n").forEach(par => {
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(w => {
      while (ctx.measureText(w).width > maxW) { // kata sangat panjang dipotong
        let i = w.length; while (i > 1 && ctx.measureText(w.slice(0, i)).width > maxW) i--;
        if (line) { lines.push(line); line = ""; }
        lines.push(w.slice(0, i)); w = w.slice(i);
      }
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
    });
    lines.push(line);
  });
  while (lines.length > 1 && !lines[lines.length - 1]) lines.pop();
  return lines;
}

async function gambar() {
  if (!pesan) return;
  await Promise.all([
    document.fonts.load('italic 500 40px "Cormorant Garamond"'), document.fonts.load('600 40px "Cormorant Garamond"'),
    document.fonts.load('500 30px "Cinzel"'), document.fonts.load('600 22px "Jost"')]);
  if (BG_DI_GAMBAR && bgImg === undefined)
    bgImg = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = "background.jpg"; });

  const jwb = $("jwb").value.trim(), W = 1080, H = $("fmt").value === "story" ? 1920 : 1350;
  const c = $("c"), ctx = c.getContext("2d");
  c.width = W; c.height = H;
  ctx.textBaseline = "alphabetic";

  const gold = ctx.createLinearGradient(0, 0, W, H);
  ["#f6e2a8", "#c9a24b", "#8c6a24", "#e8cf94", "#b58a35"].forEach((col, i, a) => gold.addColorStop(i / (a.length - 1), col));
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const dia = (x, y, s) => { ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath(); ctx.fill(); };

  // --- latar ---
  const bg = ctx.createRadialGradient(W / 2, H * 0.38, 80, W / 2, H / 2, H * 0.85);
  bg.addColorStop(0, "#17423a"); bg.addColorStop(1, "#050d0b");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (bgImg) {
    const k = Math.max(W / bgImg.width, H / bgImg.height), w = bgImg.width * k, h = bgImg.height * k;
    ctx.drawImage(bgImg, (W - w) / 2, (H - h) / 2, w, h);
    ctx.fillStyle = "rgba(6,16,14,.70)"; ctx.fillRect(0, 0, W, H);
  }
  const glow = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, 700);
  glow.addColorStop(0, "rgba(217,184,114,.20)"); glow.addColorStop(1, "rgba(217,184,114,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // --- bingkai: garis ganda + siku emas di sudut ---
  ctx.strokeStyle = gold; ctx.lineWidth = 2; ctx.strokeRect(44, 44, W - 88, H - 88);
  ctx.globalAlpha = .45; ctx.lineWidth = 1; ctx.strokeRect(62, 62, W - 124, H - 124); ctx.globalAlpha = 1;
  ctx.lineWidth = 6; ctx.lineCap = "square";
  [[44, 44, 1, 1], [W - 44, 44, -1, 1], [44, H - 44, 1, -1], [W - 44, H - 44, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.beginPath(); ctx.moveTo(x + dx * 72, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * 72); ctx.stroke();
  });

  // --- judul ---
  ctx.fillStyle = gold; ctx.textAlign = "center";
  dia(W / 2, 126, 9);
  ctx.font = '500 30px Cinzel, Georgia, serif'; ctx.letterSpacing = "12px";
  ctx.fillText(JUDUL_KARTU, W / 2 + 6, 188); ctx.letterSpacing = "0px";
  ctx.fillRect(W / 2 - 70, 214, 140, 2);

  // --- tata letak dua panel: pesan (atas) dan jawaban (bawah) ---
  const padX = 56, padT = 62, padB = 50, px = 90, pw = W - 180, tw = pw - 2 * padX;
  const top0 = 250, areaH = (H - 210) - top0, gap = 52;
  const qf = s => `italic 500 ${s}px "Cormorant Garamond", Georgia, serif`;
  const af = s => `600 ${s}px "Cormorant Garamond", Georgia, serif`;
  const fit = (text, ff, maxH, max, min, k) => {
    let s = max, l, lh;
    for (; s >= min; s -= 2) { ctx.font = ff(s); l = wrap(ctx, text, tw); lh = s * k; if (l.length * lh <= maxH) break; }
    if (s < min) s = min;
    const n = Math.max(1, Math.floor(maxH / lh));
    if (l.length > n) { l = l.slice(0, n); l[n - 1] = l[n - 1].replace(/\s*\S*$/, "") + "…"; }
    return { s, l, lh, h: l.length * lh };
  };
  let q, a;
  if (jwb) {
    const T = areaH - gap - 2 * (padT + padB);
    q = fit(pesan.pesan, qf, T * .42, 54, 30, 1.4);
    a = fit(jwb, af, T - q.h, 64, 32, 1.38);
  } else q = fit(pesan.pesan, qf, areaH - padT - padB, 72, 32, 1.4);
  const qH = q.h + padT + padB, aH = a ? a.h + padT + padB : 0;
  const qy = top0 + (areaH - (qH + (a ? gap + aH : 0))) / 2;

  const chip = (t, x, cy, fill, col, stroke) => {
    ctx.font = '600 22px Jost, sans-serif'; ctx.letterSpacing = "3px";
    let s = t; while (ctx.measureText(s).width > 520 && s.length > 3) s = s.slice(0, -2);
    if (s !== t) s = s.trim() + "…";
    const w = ctx.measureText(s).width + 56;
    rr(x, cy - 23, w, 46, 23); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = col; ctx.textAlign = "left"; ctx.fillText(s, x + 29, cy + 8); ctx.letterSpacing = "0px";
  };

  // panel pesan: kaca tipis berbingkai emas
  rr(px, qy, pw, qH, 26); ctx.fillStyle = "rgba(255,255,255,.055)"; ctx.fill();
  ctx.strokeStyle = gold; ctx.lineWidth = 2; ctx.stroke();
  ctx.globalAlpha = .10; ctx.fillStyle = gold; ctx.textAlign = "right";
  ctx.font = '500 280px "Cormorant Garamond", Georgia, serif'; ctx.fillText("\u201D", px + pw - 34, qy + 250); ctx.globalAlpha = 1;
  ctx.fillStyle = "#f6ecd2"; ctx.textAlign = "left"; ctx.font = qf(q.s);
  q.l.forEach((l, i) => ctx.fillText(l, px + padX, qy + padT + q.s * .9 + i * q.lh));
  chip("DARI " + pesan.dari.toUpperCase(), px + 40, qy, gold, "#10241f");

  // panel jawaban: emas solid, teks gelap
  if (a) {
    const ay = qy + qH + gap, g2 = ctx.createLinearGradient(px, ay, px + pw, ay + aH);
    ["#f6e4ae", "#dcb96f", "#c4973f"].forEach((col, i) => g2.addColorStop(i / 2, col));
    ctx.save(); ctx.shadowColor = "rgba(217,184,114,.35)"; ctx.shadowBlur = 50;
    rr(px, ay, pw, aH, 26); ctx.fillStyle = g2; ctx.fill(); ctx.restore();
    ctx.strokeStyle = "rgba(14,37,32,.35)"; ctx.lineWidth = 1.5; rr(px + 10, ay + 10, pw - 20, aH - 20, 18); ctx.stroke();
    ctx.fillStyle = "#0e2520"; ctx.textAlign = "left"; ctx.font = af(a.s);
    a.l.forEach((l, i) => ctx.fillText(l, px + padX, ay + padT + a.s * .9 + i * a.lh));
    chip("JAWABAN", px + 40, ay, "#0b1f1a", "#e8cf94", gold);
  }

  // --- footer ---
  ctx.fillStyle = gold; ctx.globalAlpha = .6; ctx.fillRect(90, H - 150, W - 180, 1.5); ctx.globalAlpha = 1; dia(W / 2, H - 150, 7);
  ctx.font = '500 24px Jost, sans-serif'; ctx.letterSpacing = "5px"; ctx.fillStyle = "#e8cf94";
  const tgl = new Date(pesan.waktu).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }).toUpperCase();
  if (AKUN) { ctx.textAlign = "left"; ctx.fillText(tgl, 90, H - 98); ctx.textAlign = "right"; ctx.fillText(AKUN, W - 90, H - 98); }
  else { ctx.textAlign = "center"; ctx.fillText(tgl, W / 2 + 2, H - 98); }
  ctx.letterSpacing = "0px";
  c.hidden = false;
}

(async () => {
  try {
    const r = await api({ action: "get", key, id });
    if (!r.ok) { $("err").textContent = r.error; if (r.error === "Kunci salah.") location.replace("admin.html"); return; }
    pesan = r.data; $("err").textContent = "";
    $("ctrl").hidden = false; $("unduh").hidden = false; $("hapus").hidden = false;
    await gambar();
  } catch { $("err").textContent = "Gagal terhubung ke server."; }
})();

const gambarUlang = () => { clearTimeout(timer); timer = setTimeout(gambar, 150); };
$("jwb").addEventListener("input", () => { $("cnt").textContent = $("jwb").value.length + "/400"; gambarUlang(); });
$("fmt").addEventListener("change", gambar);

$("unduh").onclick = () => {
  const a = document.createElement("a");
  a.download = "pesan-" + id.slice(0, 8) + ".png";
  a.href = $("c").toDataURL("image/png"); a.click();
};
$("hapus").onclick = async () => {
  if (!confirm("Hapus pesan ini secara permanen?")) return;
  const r = await api({ action: "delete", key, id });
  if (r.ok) location.href = "admin.html"; else $("err").textContent = r.error;
};
</script></body></html>
