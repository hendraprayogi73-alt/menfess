
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06110e">
  <meta name="description" content="Kirim Menfess dan Songfess secara rahasia.">
  <title>Secret Letter — Menfess &amp; Songfess</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="frame">
      <header class="brand">
        <div class="icon" aria-hidden="true">✉</div>
        <h1>Secret Letter</h1>
        <p class="sub">
          Ada sesuatu yang ingin kamu sampaikan?
          Kirim pesan rahasia atau titipkan lagu untuk seseorang.
        </p>
        <div class="orn" aria-hidden="true"></div>
      </header>

      <div class="modes" role="group" aria-label="Jenis pesan">
        <button type="button" class="mode active"
                data-mode="menfess" aria-pressed="true">
          <strong>✉ Menfess</strong>
          <small>Pesan dari hati</small>
        </button>

        <button type="button" class="mode"
                data-mode="songfess" aria-pressed="false">
          <strong>♫ Songfess</strong>
          <small>Pesan lewat lagu</small>
        </button>
      </div>

      <form id="form">
        <div class="field">
          <label for="dari">
            Dari
            <span class="optional">Opsional · nama samaran</span>
          </label>
          <input id="dari" name="dari" maxlength="40"
                 placeholder="Anonim" autocomplete="nickname">
        </div>

        <div id="songFields" class="song-fields">
          <div class="field">
            <label for="lagu">Judul lagu</label>
            <input id="lagu" name="lagu" maxlength="120"
                   placeholder="Contoh: Hati-Hati di Jalan">
          </div>

          <div class="field">
            <label for="penyanyi">
              Nama penyanyi
              <span class="optional">Opsional</span>
            </label>
            <input id="penyanyi" name="penyanyi" maxlength="100"
                   placeholder="Contoh: Tulus">
          </div>
        </div>

        <div class="field">
          <label for="pesan">
            <span id="messageLabel">Pesanmu</span>
            <span class="count" id="cnt">0/600</span>
          </label>

          <textarea id="pesan" name="pesan" maxlength="600"
                    placeholder="Tulis apa yang ingin kamu sampaikan..."
                    required></textarea>
        </div>

        <p class="song-note" id="songNote">
          Songfess dikirim dalam bentuk teks, tanpa audio.
        </p>

        <input class="hp" id="website" name="website"
               tabindex="-1" autocomplete="off" aria-hidden="true">

        <button class="submit" id="kirim" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="buttonText">Kirim pesan rahasia</span>
          <span id="buttonIcon" aria-hidden="true">↗</span>
        </button>

        <div class="msg" id="msg" role="status"
             aria-live="polite"></div>
      </form>

      <div class="privacy">
        <span aria-hidden="true">◆</span>
        <span>
          Kamu boleh menggunakan nama samaran.
          Hindari membagikan informasi pribadi yang sensitif.
        </span>
      </div>

      <footer>MADE WITH ♡ · YOUR LITTLE SECRET SPACE</footer>
    </section>
  </main>

  <script src="config.js"></script>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      const form = $("form");
      const message = $("pesan");
      const sender = $("dari");
      const song = $("lagu");
      const artist = $("penyanyi");
      const button = $("kirim");
      const buttonText = $("buttonText");
      const buttonIcon = $("buttonIcon");
      const songFields = $("songFields");
      const songNote = $("songNote");
      const msg = $("msg");
      const count = $("cnt");

      let mode = "menfess";
      let sending = false;

      function showMessage(text, type) {
        msg.textContent = text;
        msg.className = "msg show " + type;
      }

      function clearMessage() {
        msg.textContent = "";
        msg.className = "msg";
      }

      function updateCount() {
        count.textContent = message.value.length + "/600";
      }

      function setMode(nextMode) {
        mode = nextMode;
        clearMessage();

        document.querySelectorAll(".mode").forEach(btn => {
          const active = btn.dataset.mode === mode;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-pressed", String(active));
        });

        const isSong = mode === "songfess";

        songFields.classList.toggle("visible", isSong);
        songNote.classList.toggle("visible", isSong);

        $("messageLabel").textContent =
          isSong ? "Pesan untuk penerima" : "Pesanmu";

        message.placeholder = isSong
          ? "Lagu ini mengingatkanku padamu..."
          : "Tulis apa yang ingin kamu sampaikan...";

        buttonText.textContent = isSong
          ? "Kirim Songfess"
          : "Kirim pesan rahasia";

        buttonIcon.textContent = isSong ? "♫" : "↗";
      }

      document.querySelectorAll(".mode").forEach(btn => {
        btn.addEventListener("click", () => {
          setMode(btn.dataset.mode);
        });
      });

      message.addEventListener("input", updateCount);

      form.addEventListener("submit", async event => {
        event.preventDefault();

        if (sending) return;

        const pesan = message.value.trim();
        const dari = sender.value.trim();

        if (pesan.length < 2) {
          showMessage("Tulis pesan minimal 2 karakter.", "error");
          message.focus();
          return;
        }

        if (mode === "songfess" && !song.value.trim()) {
          showMessage("Isi judul lagu terlebih dahulu.", "error");
          song.focus();
          return;
        }

        if ($("website").value) {
          showMessage("Pesan tidak dapat diproses.", "error");
          return;
        }

        sending = true;
        button.disabled = true;
        button.classList.add("loading");
        buttonText.textContent = "Mengirim...";
        buttonIcon.classList.add("hidden");
        clearMessage();

        try {
          if (typeof api !== "function") {
            throw new Error("Fungsi api() tidak ditemukan di config.js");
          }

          const result = await api({
            action: "send",
            jenis: mode,
            dari: dari || "Anonim",
            pesan: pesan,
            lagu: mode === "songfess" ? song.value.trim() : "",
            penyanyi: mode === "songfess" ? artist.value.trim() : "",
            website: ""
          });

          if (result && result.ok) {
            const sentMode = mode;

            showMessage(
              sentMode === "songfess"
                ? "Songfess berhasil dikirim. Semoga pesannya sampai ke hati ♡"
                : "Pesan berhasil dikirim. Terima kasih sudah berbagi ♡",
              "success"
            );

            form.reset();
            updateCount();
            setMode(sentMode);
          } else {
            showMessage(
              result && result.error
                ? result.error
                : "Gagal mengirim pesan. Silakan coba lagi.",
              "error"
            );
          }
        } catch (error) {
          console.error("Pengiriman gagal:", error);
          showMessage(
            "Tidak dapat terhubung ke server. Periksa koneksi dan konfigurasi API.",
            "error"
          );
        } finally {
          sending = false;
          button.disabled = false;
          button.classList.remove("loading");
          buttonIcon.classList.remove("hidden");

          buttonText.textContent = mode === "songfess"
            ? "Kirim Songfess"
            : "Kirim pesan rahasia";
        }
      });
    })();
  </script>
</body>
</html>
